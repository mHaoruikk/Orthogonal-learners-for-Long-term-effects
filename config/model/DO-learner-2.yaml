name: LTO_Learner
weight_type: dual-sq         # identity | to | lo | dual | dual-sq
num_crossfit: 3

nuisances:
  pi_x:
    type: logistic
    parameters:
      penalty: l2
      C: 1.0
      tol: 1e-4
      fit_intercept: true
  pi_s_x:
    type: logistic
    parameters:
      penalty: elasticnet
      l1_ratio: 0.5
      solver: saga
      C: 1.0
      tol: 1e-4
      fit_intercept: true

  rho_x:
    type: logistic
    parameters:
      penalty: elasticnet
      l1_ratio: 0.5
      solver: saga
      C: 1.0
      tol: 1e-4
      fit_intercept: true
  rho_s_x:
    type: logistic
    parameters:
      penalty: elasticnet
      l1_ratio: 0.5
      solver: saga
      C: 1.0
      tol: 1e-4
      fit_intercept: true
  h:
    type: xgboost
    crossfit: true
    parameters:
      n_estimators: 100
      max_depth: 5
      learning_rate: 0.1
      subsample: 0.8
      colsample_bytree: 0.8
  mu_0:
    type: xgboost
    parameters:
      fit_intercept: False
  mu_1:
    type: xgboost
    parameters:
      fit_intercept: False

cate_regressor:
  type: xgboost
  parameters:
    n_estimators: 100
    max_depth: 5
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
