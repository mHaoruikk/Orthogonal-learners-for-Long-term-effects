name: IPW_Learner
num_crossfit: 3

nuisances:
  pi_x:
    type: logistic
    parameters:
      penalty: l2
      C: 1.0
      tol: 1e-4
      fit_intercept: true
  h:
    type: linear
    parameters:
      fit_intercept: true

cate_regressor:
  type: xgboost
  parameters:
    n_estimators: 100
    max_depth: 5
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
