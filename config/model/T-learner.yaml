# conf/model/overlap_orth.yaml
name: t_learner
backend: sklearn            
lambda_type: none
num_crossfit: 3

nuisances:
  h:     #config for h(S,X)
    type: linear # lasso, ridge, elasticnet, linear
    parameters:
      fit_intercept: False
  mu_0: #config for \mu(a,x)
    type: lasso # lasso, ridge, elasticnet, linear
    parameters:
      fit_intercept: False
  mu_1: #config for \mu(a,x)
    type: lasso # lasso, ridge, elasticnet, linear
    parameters:
      fit_intercept: False
  pi_x:  #config for estimator \pi(x)
    type: logistic
    parameters:
      penalty: l2
      C: 1.0
      tol: 1e-4
      fit_intercept: true


cate_regressor:
  type: linear # lasso, ridge, elasticnet, linear
  parameters:
      fit_intercept: False


  