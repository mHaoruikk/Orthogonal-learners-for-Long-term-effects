name: RA_Learner
num_crossfit: 3

nuisances:
  h:
    type: linear
    parameters:
      fit_intercept: true
  mu_0:
    type: linear
    parameters:
      fit_intercept: true
  mu_1:
    type: linear
    parameters:
      fit_intercept: true

cate_regressor:
  type: xgboost
  parameters:
    n_estimators: 100
    max_depth: 5
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
